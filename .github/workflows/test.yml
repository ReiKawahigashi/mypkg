name: test
on: push
jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/reikawahigashi/ubuntu24.04-ros2:latest
      options: --user root
    steps:
      - uses: actions/checkout@v2
      - name: build and test
        run: |
          rsync -av ./ /root/ros2_ws/src/mypkg/
          cd /root/ros2_ws
          bash -xv ./src/mypkg/test/test.bash /root
