name: test
on: push
jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: ros:humble
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        shell: bash
        run: |
          mkdir -p /root/ros2_ws/src/mypkg
          cp -r ./* /root/ros2_ws/src/mypkg/
          cd /root/ros2_ws
          bash -xv ./src/mypkg/test/test.bash /root
